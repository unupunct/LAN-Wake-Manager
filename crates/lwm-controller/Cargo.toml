[package]
name = "lwm-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
lwm-core = { path = "../lwm-core" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
tower = "0.5"
base64 = "0.22"
qrcode = "0.14"
ipnet = "2"
chrono-tz = "0.10"
mdns-sd = "0.13"

[package.metadata.deb]
name = "lan-wake-manager-controller"
maintainer = "unupunct <unupunct@users.noreply.github.com>"
copyright = "2026, unupunct"
license-file = ["../../LICENSE", "0"]
extended-description = "Controller service: manages computers, schedules and remote (VPN) access. Serves the dashboard on http://127.0.0.1:8480 and the API on https://0.0.0.0:8443."
section = "net"
priority = "optional"
depends = "$auto, systemd, iputils-ping"
assets = [
  ["target/release/lwm-controller", "usr/bin/", "755"],
  ["../../packaging/linux/lan-wake-controller.service", "lib/systemd/system/", "644"],
]
maintainer-scripts = "../../packaging/linux/controller/"
